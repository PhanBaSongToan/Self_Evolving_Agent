[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-query-routing"
version = "0.1.0"
description = "Auditable reproduction of the non-deep-learning subset of Lightweight Query Routing for Adaptive RAG."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
extended-classical = [
  "xgboost==3.3.0",
  "lightgbm==4.7.0",
  "catboost==1.2.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
